[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
optimizer = true
optimizer_runs = 25
via_ir = true
solc = "0.8.24"
fs_permissions = [{ access = "read-write", path = "./gauge-sync" }, { access = "read", path = "./fixtures/upstream-gauge/out" }]

[lint]
exclude_lints = [
  "unsafe-typecast",
  "erc20-unchecked-transfer",
]
