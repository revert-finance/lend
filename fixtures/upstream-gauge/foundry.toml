[profile.default]
src = "src"
test = "none"
script = "none"
out = "out"
libs = ["../../lib"]
auto_detect_remappings = false
solc = "0.7.6"
optimizer = true
optimizer_runs = 200
remappings = [
  "contracts/=../../lib/aero-slipstream/contracts/",
  "@openzeppelin/contracts/=../../lib/openzeppelin-v3/contracts/"
]
